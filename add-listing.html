<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f68b1e">
  <title>Post a product | Murang’a Sokoni</title>
  <link rel="stylesheet" href="css/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/listing-form.js"></script>
</head>
<body class="form-page">
  <header class="form-header"><a href="dashboard.html" class="back-link">← My dashboard</a><a class="wordmark form-wordmark" href="index.html"><span class="brand-mark">M</span><span>murang’a<span class="wordmark-accent">sokoni</span></span></a></header>
  <main class="form-container"><section class="form-card listing-form-card"><p class="eyebrow">REACH LOCAL SHOPPERS</p><h1>Post a product</h1><p>Tell Murang’a what you have to offer.</p>
    <form id="listing-form">
      <div class="form-group"><label for="item-title">Product or service name</label><input id="item-title" name="title" type="text" maxlength="120" placeholder="e.g. Fresh avocados, 1 dozen" required></div>
      <div class="form-row"><div class="form-group"><label for="category">Category</label><select id="category" name="category" required><option value="">Choose a category</option><option value="food">Food & farming</option><option value="clothes">Clothes & fashion</option><option value="building">Building materials</option><option value="electronics">Electronics</option><option value="services">Services</option></select></div>
      <div class="form-group"><label for="price">Price (KSh)</label><input id="price" name="price" type="number" inputmode="numeric" min="0" step="1" placeholder="e.g. 1200" required></div></div>
      <div class="form-group"><label for="location">Where is it available?</label><select id="location" name="location" required><option value="">Choose your area</option><option value="kigumo">Kigumo</option><option value="maragua">Maragua</option><option value="murangatown">Murang’a Town</option><option value="gatanga">Gatanga</option><option value="kandara">Kandara</option><option value="kiharu">Kiharu</option><option value="kangema">Kangema</option></select></div>
      <div class="form-group"><label for="description">Description <span class="optional">(optional)</span></label><textarea id="description" name="description" rows="4" maxlength="1000" placeholder="Share useful details like size, quality, or pickup arrangements."></textarea></div>
      <div class="form-group"><label for="image-input">Product photo <span class="optional">(optional, up to 5 MB)</span></label><input id="image-input" name="image" type="file" accept="image/jpeg,image/png,image/webp"><div id="image-preview" class="image-preview" hidden></div></div>
      <p id="listing-message" class="notice" role="status" aria-live="polite" hidden></p>
      <button id="listing-submit" type="submit" class="btn btn-primary btn-block">Post listing</button>
    </form>
  </section></main>
  <footer class="site-footer"><p>Local finds. Local people. One Murang’a.</p><p><a href="index.html">Back to the marketplace</a></p></footer>
</body>
</html>
