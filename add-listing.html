<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a New Listing – Murang'a Sokoni</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="form-header">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>Post an Item</h1>
  </header>

  <section class="form-container">
    <div class="form-card">
      <h2>What are you selling?</h2>
      <p>Add details about your product or service.</p>
      
      <form id="listing-form">
        <div class="form-group">
          <label for="item-title">Item Title</label>
          <input type="text" id="item-title" placeholder="e.g., 50kg Sack of Maize" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="food">Food & Farming</option>
            <option value="clothes">Clothes & Fashion</option>
            <option value="building">Building Materials</option>
            <option value="electronics">Electronics</option>
            <option value="services">Services</option>
          </select>
        </div>

        <div class="form-group">
          <label for="price">Price (KSh)</label>
          <input type="number" id="price" placeholder="e.g., 1200" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" placeholder="Describe your item..."></textarea>
        </div>

        <div class="form-group">
          <label>Product Photo</label>
          <div class="image-upload-box">
            <span>Click to upload photo</span>
            <input type="file" accept="image/*" style="display:none;" id="image-input">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Post Listing Now</button>
      </form>
    </div>
  </section>
</body>
</html>
