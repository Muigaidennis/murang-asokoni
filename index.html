<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murang'a Sokoni – Marketplace for Murang'a County</title>
  <link rel="stylesheet" href="css/main.css">
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Sticky search bar -->
  <div class="search-bar">
    <input type="text" placeholder="Search for products, sellers, or locations in Murang'a...">
    <select>
      <option value="">All Categories</option>
      <option value="food">Food & Farming</option>
      <option value="clothes">Clothes & Fashion</option>
      <option value="building">Building Materials</option>
      <option value="electronics">Electronics</option>
      <option value="services">Services</option>
    </select>
    <select>
      <option value="">All Locations</option>
      <option value="kigumo">Kigumo</option>
      <option value="maragua">Maragua</option>
      <option value="murangatown">Murang'a Town</option>
      <option value="gatanga">Gatanga</option>
      <option value="kandara">Kandara</option>
    </select>
    <button id="search-btn" class="search-btn">Search</button>
  </div>

  <!-- Hero -->
  <section class="hero">
    <h1 class="hero-brand">Murang'a Sokoni</h1>
    <p class="hero-tagline">Marketplace for all buyers and sellers in Murang'a County</p>
    <a href="register-seller.html" class="btn btn-primary">Join as a Seller</a>
    <a href="#listings-section" class="btn btn-secondary">Browse Listings</a>
  </section>

  <!-- Real Listings Section -->
  <section id="listings-section" class="popular-listings">
    <h2>Available Listings in Murang'a County</h2>
    <!-- This container starts EMPTY and will be filled by your database -->
    <div id="dynamic-listings" class="listings-grid">
      <p style="text-align: center; grid-column: 1/-1; padding: 2rem; color: #6B7280;">Loading local listings...</p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 <strong>Murang'a Sokoni</strong> – Local Marketplace.</p>
    <p>
      <a href="index.html">Home</a> |
      <a href="register-seller.html">Join as Seller</a> |
      <a href="dashboard.html">Dashboard</a>
    </p>
  </footer>

  <!-- DATA FETCHING SCRIPT -->
  <script>
    // 1. REPLACE THESE with your actual Supabase URL and Key
    const SUPABASE_URL = 'https://your-project-url.supabase.co';
    const SUPABASE_KEY = 'your-anon-public-key';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadListings() {
      const { data, error } = await supabaseClient
        .from('listings')
        .select('*')
        .order('created_at', { ascending: false }); // Show newest first

      const container = document.getElementById('dynamic-listings');

      if (error) {
        container.innerHTML = `<p style="color:red; grid-column:1/-1;">Error loading items: ${error.message}</p>`;
        return;
      }

      if (data && data.length > 0) {
        container.innerHTML = ''; // Clear the "Loading..." text
        data.forEach(item => {
          container.innerHTML += `
            <div class="listing-card">
              <div class="listing-img">
                ${item.image_url ? 
                  `<img src="${item.image_url}" style="width:100%; height:100%; object-fit:cover; border-radius:10px 10px 0 0;">` : 
                  `<div style="display:flex; align-items:center; justify-content:center; height:100%; background:#F3F4F6; color:#9CA3AF;">No Image</div>`
                }
              </div>
              <div class="listing-body">
                <div class="listing-title">${item.title}</div>
                <div class="listing-price">KSh ${item.price.toLocaleString()}</div>
                <div class="listing-location">📍 ${item.location}</div>
                <div style="font-size: 0.8rem; color: #9CA3AF; margin-top: 0.5rem;">Category: ${item.category}</div>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:3rem;">No listings found. Be the first to post!</p>';
      }
    }

    // Run the function when the page loads
    window.onload = loadListings;
  </script>
</body>
</html>
